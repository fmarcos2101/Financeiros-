mode: paper  # paper | live (live ainda não implementado)

exchange:
  name: binance
  # data-api.binance.vision: endpoint público de mercado (evita bloqueio 451 regional)
  base_url: https://data-api.binance.vision
  timeout_seconds: 15

universe:
  symbols:
    - BTCUSDT
    - ETHUSDT
  interval: 1h
  lookback_candles: 120

analysis:
  fast_sma: 12
  slow_sma: 26
  min_signal_strength: 0.001  # spread mínimo |SMA_fast-SMA_slow|/preço (~0.1%)
  max_volatility: 0.08  # desvio-padrão relativo das retornos recentes

exits:
  enabled: true
  stop_loss_pct: 0.03     # sai se cair 3% abaixo do preço médio de entrada
  take_profit_pct: 0.06   # realiza se subir 6% acima da entrada

capital:
  starting_cash_usdt: 1000.0
  risk_per_trade: 0.01      # 1% do equity por trade
  max_position_pct: 0.20    # no máximo 20% do equity em um ativo
  max_open_positions: 2
  min_notional_usdt: 10.0
  # Em cada venda com lucro, X% do PnL realizado vai para o fundo reserva
  # (sai do caixa de trading e não é usado para novas compras)
  reserve_enabled: true
  reserve_skim_pct: 0.20

memory:
  db_path: data/memory/financeiros.db

execution:
  fee_bps: 10  # 0.10% por lado (simulação paper)

runtime:
  cycle_interval_seconds: 3600  # 1h entre ciclos no run-loop
  log_dir: data/logs
