[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financeiros"
version = "0.1.0"
description = "Robô pessoal de análise e paper trading para cripto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-httpx>=0.30",
]

[project.scripts]
financeiros = "financeiros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financeiros = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
